# Per-component resource budgets for compose
version: 1
components:
  datasource_emitter_writer:
    cpus_min: 1
    cpus_max: 2
    mem_min_mb: 512
    mem_max_mb: 1024
    pids_max: 200
    oom_score_adj: -200

  swarm:
    cpus_min: 0.5
    cpus_max: 4
    mem_min_mb: 512
    mem_max_mb: 4096
    pids_max: 500
    oom_score_adj: 0

  server:
    cpus_min: 0.5
    cpus_max: 2
    mem_min_mb: 256
    mem_max_mb: 1024
    pids_max: 200
    oom_score_adj: -100

  patcher_workers:
    cpus_min: 0.25
    cpus_max: 1
    mem_min_mb: 256
    mem_max_mb: 1024
    pids_max: 100
    oom_score_adj: 200
