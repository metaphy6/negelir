# Phase 18.6 §18.6 ledger #17 — Server/internal RPC contract descriptor
#
# Single source of truth for the swarm ↔ server write path.
# Swarm agents call these endpoints to write predictions, calibration data, etc.
# into the server. This descriptor is binding — changes require dual CODEOWNERS ACK.
#
# Version: 1.0.0 (aligned to server component versioning)

openapi: 3.0.0
info:
  title: Negelir Server Internal API
  description: Private RPC interface for swarm agents to write predictions and state
  version: 1.0.0
  contact:
    name: Negelir Ops
  x-phase-18-6-ledger: 17

servers:
  - url: http://server:8080/internal/v1
    description: Internal VPC (mTLS or HMAC token required)
    x-component: server
    x-auth: mTLS or HMAC-SHA256 bearer token

paths:
  /predictions/write:
    post:
      summary: Write predicted match outcomes
      description: Swarm predictor writes approved predictions
      operationId: writePredictions
      x-owner-component: swarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - predictions
                - correlation_id
              properties:
                predictions:
                  type: array
                  items:
                    $ref: '#/components/schemas/PredictionRecord'
                correlation_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Predictions accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  written_count:
                    type: integer
                  trace_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /calibration/write:
    post:
      summary: Write calibration sketch updates
      description: Swarm sends calibration data for model tuning
      operationId: writeCalibration
      x-owner-component: swarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalibrationUpdate'
      responses:
        '200':
          description: Calibration data accepted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      summary: Liveness probe
      description: Check if server/internal endpoint is healthy
      operationId: health
      x-owner-component: common
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  version:
                    type: string

components:
  schemas:
    PredictionRecord:
      type: object
      required:
        - match_id
        - prediction
        - confidence
        - model_version
      properties:
        match_id:
          type: string
          description: Unique match identifier
        prediction:
          type: object
          description: Prediction outcome (1x2, both_score, etc)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        model_version:
          type: string
          description: Model version that produced this prediction
        correlation_id:
          type: string
          format: uuid

    CalibrationUpdate:
      type: object
      required:
        - sketches
      properties:
        sketches:
          type: array
          items:
            type: object
            properties:
              predictor_id:
                type: string
              sketch_data:
                type: string
                format: base64
              timestamp:
                type: string
                format: date-time

  responses:
    Unauthorized:
      description: Authentication failed (mTLS cert missing or token invalid)
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
                enum: [SERVER_UNAUTHORIZED_CROSS_COMPONENT]
              message:
                type: string

    Forbidden:
      description: Authorization failed (token scope insufficient)
      content:
        application/json:
          schema:
            type: object
            properties:
              error_code:
                type: string
                enum: [SERVER_FORBIDDEN_SCOPE]
              message:
                type: string

  securitySchemes:
    mTLS:
      type: mutualTLS
      description: Mutual TLS (client certificate required)
      x-component: common.security

    HMACToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HMAC-SHA256 signed token (component, scope, expiry)
      x-component: common.security

security:
  - mTLS: []
  - HMACToken: []

x-phase-18-6:
  ledger_ref: 17
  owner_component: server
  consumers:
    - swarm
  descriptor_version: 1.0.0
  last_verified_code_sha: "placeholder"
  last_verified_against_code: "2026-06-15"
  dual_codeowner_required: true
