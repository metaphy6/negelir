# Phase 10 §10.18 — Golden corpus for NLP evaluation harness
#
# This is the single source of truth for Turkish NLP evaluation.
# Coverage: 250 entries covering all intents + distribution targets.
#
# Schema:
#   - id: unique stable identifier
#   - raw: Turkish query text (as user would type)
#   - locale: tr-TR
#   - expected_intent: from §10.4 closed enum
#   - expected_entities: [{kind, canonical_id, span_start, span_end}, ...]
#   - expected_template_id: template file basename (without .tr.j2)
#   - expected_disambiguation: bool (should we offer disambiguation?)
#   - tags: [clean|no_diacritics|typo|slang|code_switch|adversarial|temporal]
#
# Distribution targets (§10.18):
#   clean=60, no_diacritics=60, typos=50, slang=30, code_switch=20,
#   adversarial=20, temporal=10 (Total=250)

