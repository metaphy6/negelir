profile_id: international_knockout
description: |
  EURO/World Cup/Copa América/AFCON knockout rounds.
  Highest-stakes matches; neutral or host-country venues; maximum volatility.

elo_home_advantage_mult: 0.40
dixon_coles_rho_add: 0.04
draw_sample_weight_mult: 0.6
poisson_max_goals_add: 1.2
xg_elo_factor_range_mult: 1.20
upset_prior: 0.05
zero_home_advantage_when_venue_in: ["neutral", "bubble", "host_country"]
two_leg:
  away_goals_rule_active_until: "1970-01-01"
  aggregate_logic: sum_goals
  penalty_shootout_modeled: true
