  # negelir_opsctl ACL user — provisioned by §2 mock setup + Phase 14 K8s.
  opsctl_redis_expected_user: negelir_opsctl       # NEGELIR_OPSCTL_REDIS_EXPECTED_USER
  # Require HMAC-SHA256 op_signature on every opsctl envelope.
  # Set to false in mock environments; true in prod.
  opsctl_require_signature: true                   # NEGELIR_OPSCTL_REQUIRE_SIGNATURE
  # Path to 32-byte operator key (mode 0600). Empty = ~/.negelir/opsctl_key
  opsctl_key_path: ""                              # NEGELIR_OPSCTL_KEY_PATH
  # Operator registry JSON. Empty = infra/maint/opsctl_operators.json
  opsctl_operators_file: ""                        # NEGELIR_OPSCTL_OPERATORS_FILE
  # Per-subcommand authz YAML. Empty = infra/maint/opsctl_authz.yaml
  opsctl_authz_file: ""                            # NEGELIR_OPSCTL_AUTHZ_FILE
