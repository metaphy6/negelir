  # ── §8.2 maint.scaler.v1 ──
  maint_scaler_decision_window_ms: 30000           # NEGELIR_MAINT_SCALER_DECISION_WINDOW_MS
  maint_scaler_clock_source: auto                  # NEGELIR_MAINT_SCALER_CLOCK_SOURCE
