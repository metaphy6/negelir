# =============================================================================
# Negelir — Canonical default configuration reference.
# -----------------------------------------------------------------------------
# This file is the single human-readable source of truth for every tunable
# default in the AI stack.
#
#   * Authoritative runtime values live in `ai/common/config.py` (Config) and
#     `ai/common/league_config.py` (LeagueConfig); each
#     `field(default_factory=...)` reads the matching environment variable
#     shown below, falling back to the value listed here.
#   * `.env.example` mirrors these env-var names — keep all three files in
#     sync when adding new tunables.
#   * Nothing imports this file at runtime (it is documentation), so editing a
#     value here has no effect; set the env var or override the dataclass.
# =============================================================================

# ── PostgreSQL ───────────────────────────────────────────────────────────────
postgres:
  host: localhost            # POSTGRES_HOST
  port: 5432                 # POSTGRES_PORT
  db: negelir                # POSTGRES_DB
  user: negelir              # POSTGRES_USER
  password: ""               # POSTGRES_PASSWORD  (REQUIRED in .env, never default)

# ── Redis ────────────────────────────────────────────────────────────────────
redis:
  host: localhost            # REDIS_HOST
  port: 6379                 # REDIS_PORT
  socket_timeout_sec: 2      # NEGELIR_REDIS_SOCKET_TIMEOUT

# ── Go server ────────────────────────────────────────────────────────────────
server:
  url: http://localhost:8080 # SERVER_URL
  fetch_timeout_sec: 10      # NEGELIR_SERVER_FETCH_TIMEOUT

# ── AI runtime ───────────────────────────────────────────────────────────────
ai:
  device: auto               # AI_DEVICE          (auto|cpu|cuda)
  log_level: DEBUG           # AI_LOG_LEVEL

# ── Runtime defaults (league + season identity) ──────────────────────────────
runtime:
  default_league_id: super_lig            # NEGELIR_DEFAULT_LEAGUE_ID
  # default_season is date-derived (common.season.current_season, July rollover)
  # when the env var is unset/empty; pin explicitly only to override.
  default_season: ""                      # NEGELIR_DEFAULT_SEASON
  mackolik_group_id: 1                    # NEGELIR_MACKOLIK_GROUP_ID
  mackolik_league_name_filter: "Süper Lig" # NEGELIR_MACKOLIK_LEAGUE_FILTER

# ── HTTP / scrape timeouts (seconds) ─────────────────────────────────────────
timeouts:
  scrape_trigger: 30         # NEGELIR_SCRAPE_TRIGGER_TIMEOUT
  health_check: 5            # NEGELIR_HEALTH_CHECK_TIMEOUT
  mackolik_http: 15          # NEGELIR_MACKOLIK_HTTP_TIMEOUT
  scrape_http: 15            # NEGELIR_SCRAPE_HTTP_TIMEOUT
  footballdata_http: 10      # NEGELIR_FOOTBALLDATA_HTTP_TIMEOUT

# ── Scheduler (APScheduler cron) ─────────────────────────────────────────────
scheduler:
  daily_scrape_hour: 6       # NEGELIR_SCHEDULE_DAILY_SCRAPE_HOUR
  daily_scrape_minute: 0     # NEGELIR_SCHEDULE_DAILY_SCRAPE_MINUTE
  outcome_check_hour: 22     # NEGELIR_SCHEDULE_OUTCOME_CHECK_HOUR
  outcome_check_minute: 0    # NEGELIR_SCHEDULE_OUTCOME_CHECK_MINUTE
  retrain_day: sun           # NEGELIR_SCHEDULE_RETRAIN_DAY  (mon..sun)
  retrain_hour: 3            # NEGELIR_SCHEDULE_RETRAIN_HOUR
  heartbeat_minutes: 5       # NEGELIR_SCHEDULE_HEARTBEAT_MINUTES

# ── Self-healing / failover ──────────────────────────────────────────────────
self_healing:
  source_priority: [source_a, source_b, source_c, source_d]  # NEGELIR_SOURCE_PRIORITY (csv)
  stale_threshold_seconds: 604800  # NEGELIR_STALE_THRESHOLD_SECONDS  (7 days)
  stale_confidence_penalty: 0.5    # NEGELIR_STALE_CONFIDENCE_PENALTY
  source_failure_threshold: 3      # NEGELIR_SOURCE_FAILURE_THRESHOLD

# ── Scraping ─────────────────────────────────────────────────────────────────
scraping:
  rate_limit_seconds: 2      # SCRAPE_RATE_LIMIT_SECONDS
  real_data_rate_limit: 1.0  # NEGELIR_REAL_DATA_RATE_LIMIT
  user_agent: "Xops/0.1 (Football Analysis Research)"  # SCRAPE_USER_AGENT
  respect_robots_txt: true   # SCRAPE_RESPECT_ROBOTS_TXT
  sources:                   # SCRAPE_SOURCE_1, SCRAPE_SOURCE_2, SCRAPE_SOURCE_3, SCRAPE_SOURCE_4, SCRAPE_SOURCE_5, SCRAPE_SOURCE_FALLBACK, SCRAPE_SOURCE_EXTRA
    - https://www.mackolik.com
    - https://www.nesine.com
    - https://www.tff.org
    - https://raw.githubusercontent.com/openfootball/football.json/master
    - https://www.football-data.co.uk/mmz4281
    - https://arsiv.mackolik.com  # fallback
  mackolik_seasons:          # MACKOLIK_SEASON_<LABEL>
    "2025/2026": 70381
    "2024/2025": 67287
    "2023/2024": 62682
    "2022/2023": 59539
    "2021/2022": 55775

# ── Model / training ─────────────────────────────────────────────────────────
training:
  noise_pct: 0.005           # NEGELIR_TRAINING_NOISE_PCT
  test_split: 0.2            # NEGELIR_TRAINING_TEST_SPLIT
  random_seed: 42            # NEGELIR_TRAINING_SEED
  cross_source_agreement_multi: 0.95  # NEGELIR_TRAINING_CROSS_SOURCE_AGREEMENT_MULTI
  model_max_size_mb: 8.0     # NEGELIR_MODEL_MAX_SIZE_MB
  min_matches: 100           # NEGELIR_TRAINING_MIN_MATCHES
  sample_weights: [1.0, 2.0, 1.0]  # NEGELIR_TRAINING_SAMPLE_WEIGHTS  (Home,Draw,Away)

drift:
  accuracy_window: 30        # NEGELIR_DRIFT_WINDOW (legacy ai/model/drift.py — accuracy floor)
  accuracy_floor: 0.35       # NEGELIR_DRIFT_FLOOR  (legacy ai/model/drift.py — accuracy floor)

# ── Bootstrap gate ───────────────────────────────────────────────────────────
bootstrap:
  min_matches: 100           # BOOTSTRAP_MIN_MATCHES (Makefile + proofreader)

# ── Feature-vector firewall (roadmap §5.6.2) ─────────────────────────────────
# Substring → (lo, hi). Override via NEGELIR_FEATURE_RANGES_JSON.
feature_ranges:
  elo:       [-500.0, 3500.0]
  ratio:     [0.0, 1.0]
  pct:       [0.0, 100.0]
  norm:      [0.0, 1.0]
  sentiment: [-1.0, 1.0]
  optimism:  [-1.0, 1.0]
  sin:       [-1.0, 1.0]
  cos:       [-1.0, 1.0]
  flag:      [0.0, 1.0]
  age:       [15.0, 45.0]
  scored:    [0.0, 10.0]
  conceded:  [0.0, 10.0]
  yellows:   [0.0, 10.0]
  fouls:     [0.0, 40.0]
  cards:     [0.0, 15.0]
  bayesian:  [0.0, 1.0]
  sos:       [800.0, 2200.0]
  default:   [-100.0, 100.0]

# ── Telemetry ────────────────────────────────────────────────────────────────
telemetry:
  max_stream_len: 50000      # NEGELIR_TELEMETRY_MAX_STREAM

# ── Swarm SDK (Phase 3) ──────────────────────────────────────────────────────
swarm:
  bus_kind: redis            # SWARM_BUS_KIND  (redis|memory)
  consumer_group_prefix: swarm   # SWARM_CONSUMER_GROUP_PREFIX
  heartbeat_sec: 5           # SWARM_HEARTBEAT_SEC
  registry_ttl_sec: 30       # SWARM_REGISTRY_TTL_SEC
  max_in_flight: 32          # SWARM_MAX_IN_FLIGHT
  retry_budget: 3            # SWARM_RETRY_BUDGET
  dlq_max_len: 10000         # SWARM_DLQ_MAX_LEN
  pending_claim_sec: 60      # SWARM_PENDING_CLAIM_SEC
  metrics_port: 9100         # SWARM_METRICS_PORT

# ── Phase 4 — Worker agents (scrape → categorize → process → store) ──────────
phase4:
  scrape_profile: mock                # SCRAPE_PROFILE  (mock|real)
  scrape_http_max_retries: 3          # SCRAPE_HTTP_MAX_RETRIES
  categorizer_min_conf: 0.55          # NEGELIR_CATEGORIZER_MIN_CONF
  categorizer_model_path: data/models/categorizer_v1.joblib  # NEGELIR_CATEGORIZER_MODEL_PATH
  cache_record_ttl_sec: 600           # NEGELIR_CACHE_RECORD_TTL_SEC
  cache_prediction_ttl_sec: 300       # NEGELIR_CACHE_PREDICTION_TTL_SEC
  telemetry_metrics_port: 9101        # NEGELIR_TELEMETRY_METRICS_PORT
  telemetry_metrics_bind: 127.0.0.1   # NEGELIR_TELEMETRY_METRICS_BIND
  reactor_max_event_age_sec: 86400    # NEGELIR_REACTOR_MAX_EVENT_AGE_SEC
  reactor_ledger_max_size: 100000     # NEGELIR_REACTOR_LEDGER_MAX_SIZE

# ── Phase 5 — Predictor swarm + consensus ───────────────────────────────────
phase5:
  consensus_window_ms: 750            # NEGELIR_CONSENSUS_WINDOW_MS
  consensus_min_confidence: 0.0       # NEGELIR_CONSENSUS_MIN_CONFIDENCE
  consensus_min_voters: 3             # NEGELIR_CONSENSUS_MIN_VOTERS
  consensus_brier_window: 200         # NEGELIR_CONSENSUS_BRIER_WINDOW
  consensus_max_pending: 4096         # NEGELIR_CONSENSUS_MAX_PENDING
  consensus_overflow_flag_min_interval_sec: 10  # NEGELIR_CONSENSUS_OVERFLOW_FLAG_MIN_INTERVAL_SEC
  predictor_market_features_enabled: false  # NEGELIR_PREDICTOR_MARKET_FEATURES_ENABLED
  predictor_max_vram_mb: 1024         # NEGELIR_PREDICTOR_MAX_VRAM_MB
  trainer_debounce_sec: 300           # NEGELIR_TRAINER_DEBOUNCE_SEC
  backtest_swarm_floor_pct: 0.01      # NEGELIR_BACKTEST_SWARM_FLOOR_PCT
  backtest_window_weeks: 12           # NEGELIR_BACKTEST_WINDOW_WEEKS
  backtest_min_n: 20                  # NEGELIR_BACKTEST_MIN_N
  api_consensus_overhead_ms: 250      # NEGELIR_API_CONSENSUS_OVERHEAD_MS

# ── Phase 6 — Proofreader & drift swarm ─────────────────────────────────────
phase6:
  # Replica roster lives in `swarm.agents.proofreader.replicas
  # .PROOFREADER_POLICY_CLASSES`; quorum derives from len(roster) so
  # there is no env knob to drift (Phase-6 audit F3-1 retired the
  # standalone NEGELIR_PROOFREADER_REPLICAS).
  proofreader_quorum_window_ms: 200   # NEGELIR_PROOFREADER_QUORUM_WINDOW_MS
  proofreader_aggregator_max_pending: 4096  # NEGELIR_PROOFREADER_AGGREGATOR_MAX_PENDING — LRU bound on aggregator _pending (Phase-6 audit F-9)
  swarm_flush_interval_ms: 100        # NEGELIR_SWARM_FLUSH_INTERVAL_MS — runner tick for flush_expired (Phase-6 audit F-2)
  # Per-replica check thresholds (§6.2)
  proofreader_sanity_eps: 0.01                 # NEGELIR_PROOFREADER_SANITY_EPS — sum-to-1 tolerance
  proofreader_plausibility_max_prob: 0.85      # NEGELIR_PROOFREADER_PLAUSIBILITY_MAX_PROB — single-outcome cap (warn)
  proofreader_grid_consistency_tol: 0.05       # NEGELIR_PROOFREADER_GRID_CONSISTENCY_TOL — score_grid vs market_outcomes
  # Drift agent (§6.3). NOTE: `drift_brier_ceiling` is a *Brier ceiling*
  # (lower Brier = better → trip when mean > ceiling). Distinct from
  # the legacy `drift.accuracy_floor` knob above which gates the
  # `ai/model/drift.py` accuracy detector.
  drift_window_size: 50                # NEGELIR_DRIFT_WINDOW_SIZE — rolling Brier/log-loss window
  drift_brier_ceiling: 0.30            # NEGELIR_DRIFT_BRIER_CEILING — trip when mean Brier > ceiling
  drift_pvalue: 0.01                   # NEGELIR_DRIFT_PVALUE — KS-test stationarity threshold
  drift_max_pending: 100000            # NEGELIR_DRIFT_MAX_PENDING — LRU bound on unsettled predictions
  drift_max_settled: 100000            # NEGELIR_DRIFT_MAX_SETTLED — LRU bound on settled (match,market) keys

# ── Phase 7 — Defense agents (sec.input.v1 / sec.scrape.v1 / sec.rate.v1) ────
# Foundation block: topics, payloads, JSON schemas, and config knobs land
# together. Agent logic ships in §7.1 / §7.2 / §7.3. The
# `test_python_defaults_match_env_example` gate enforces every default below
# matches `xops/env/.env.example` byte-for-byte.
phase7:
  # sec.input.v1 (§7.1) — bytes after UTF-8 encoding (NOT codepoints).
  sec_input_max_len: 8192                          # NEGELIR_SEC_INPUT_MAX_LEN
  sec_input_gateway_max_latency_ms: 10             # NEGELIR_SEC_INPUT_GATEWAY_MAX_LATENCY_MS
  sec_input_classifier_max_latency_ms: 100         # NEGELIR_SEC_INPUT_CLASSIFIER_MAX_LATENCY_MS
  sec_input_classifier_device: auto                # NEGELIR_SEC_INPUT_CLASSIFIER_DEVICE  (auto|cpu|cuda|rocm|npu)
  sec_input_classifier_path: ""                   # NEGELIR_SEC_INPUT_CLASSIFIER_PATH    (empty = no classifier loaded yet)
  sec_input_classifier_batch_enabled: auto         # NEGELIR_SEC_INPUT_CLASSIFIER_BATCH_ENABLED  (auto|true|false)
  sec_input_classifier_batch_size: 8               # NEGELIR_SEC_INPUT_CLASSIFIER_BATCH_SIZE
  sec_input_classifier_batch_window_ms: 20         # NEGELIR_SEC_INPUT_CLASSIFIER_BATCH_WINDOW_MS
  sec_input_classifier_max_pending: 256            # NEGELIR_SEC_INPUT_CLASSIFIER_MAX_PENDING
  sec_input_breaker_open_s: 30                     # NEGELIR_SEC_INPUT_BREAKER_OPEN_S
  sec_input_pattern_reload_s: 30                   # NEGELIR_SEC_INPUT_PATTERN_RELOAD_S
  # sec.quarantine.v1 + storage backpressure (§7.1 + §7.5)
  sec_quarantine_ttl_days: 30                      # NEGELIR_SEC_QUARANTINE_TTL_DAYS
  sec_quarantine_payload_max_bytes: 65536          # NEGELIR_SEC_QUARANTINE_PAYLOAD_MAX_BYTES — pre-base64 cap
  sec_quarantine_producer_queue_max: 1000          # NEGELIR_SEC_QUARANTINE_PRODUCER_QUEUE_MAX
  sec_quarantine_storage_lag_alert_ms: 5000        # NEGELIR_SEC_QUARANTINE_STORAGE_LAG_ALERT_MS
  # sec.scrape.v1 (§7.2). Streaming-statistic baseline → no per-source raw cap.
  sec_scrape_size_delta_pct: 200.0                 # NEGELIR_SEC_SCRAPE_SIZE_DELTA_PCT
  sec_scrape_inflate_ratio_max: 50.0               # NEGELIR_SEC_SCRAPE_INFLATE_RATIO_MAX
  sec_scrape_warmup_samples: 50                    # NEGELIR_SEC_SCRAPE_WARMUP_SAMPLES
  sec_scrape_baseline_flush_s: 300                 # NEGELIR_SEC_SCRAPE_BASELINE_FLUSH_S
  sec_scrape_max_pending: 4096                     # NEGELIR_SEC_SCRAPE_MAX_PENDING
  sec_scrape_dedup_window: 4096                    # NEGELIR_SEC_SCRAPE_DEDUP_WINDOW
  sec_scrape_simhash_max_distance: 12              # NEGELIR_SEC_SCRAPE_SIMHASH_MAX_DISTANCE — bits-out-of-64
  sec_scrape_dom_fingerprint_max_nodes: 5000       # NEGELIR_SEC_SCRAPE_DOM_FINGERPRINT_MAX_NODES
  sec_scrape_simhash_ring_size: 8                  # NEGELIR_SEC_SCRAPE_SIMHASH_RING_SIZE
  # sec.rate.v1 (§7.3). IPv6 prefix /64 = end-site allocation boundary.
  sec_rate_pre_auth_capacity: 30                   # NEGELIR_SEC_RATE_PRE_AUTH_CAPACITY
  sec_rate_pre_auth_refill_per_s: 0.5              # NEGELIR_SEC_RATE_PRE_AUTH_REFILL_PER_S
  sec_rate_post_auth_capacity: 600                 # NEGELIR_SEC_RATE_POST_AUTH_CAPACITY
  sec_rate_post_auth_refill_per_s: 5.0             # NEGELIR_SEC_RATE_POST_AUTH_REFILL_PER_S
  sec_rate_bucket_idle_ttl_s: 3600                 # NEGELIR_SEC_RATE_BUCKET_IDLE_TTL_S
  sec_rate_max_subjects: 100000                    # NEGELIR_SEC_RATE_MAX_SUBJECTS
  sec_rate_ipv4_prefix: 32                         # NEGELIR_SEC_RATE_IPV4_PREFIX
  sec_rate_ipv6_prefix: 64                         # NEGELIR_SEC_RATE_IPV6_PREFIX
  sec_rate_trusted_proxies: ""                    # NEGELIR_SEC_RATE_TRUSTED_PROXIES — comma-separated CIDRs
  sec_rate_redis_timeout_ms: 50                    # NEGELIR_SEC_RATE_REDIS_TIMEOUT_MS
  sec_rate_secondary_capacity: 300                 # NEGELIR_SEC_RATE_SECONDARY_CAPACITY
  sec_rate_secondary_refill_per_s: 5.0             # NEGELIR_SEC_RATE_SECONDARY_REFILL_PER_S
  sec_rate_default_cost: 1                         # NEGELIR_SEC_RATE_DEFAULT_COST
  sec_rate_eviction_rate_alert_per_s: 50.0         # NEGELIR_SEC_RATE_EVICTION_RATE_ALERT_PER_S
  sec_rate_eviction_rate_window_s: 60              # NEGELIR_SEC_RATE_EVICTION_RATE_WINDOW_S
  # Sliding-window burst detector (§7.3) — monotonic-clock-based.
  sec_burst_threshold: 100                         # NEGELIR_SEC_BURST_THRESHOLD
  sec_burst_window_ms: 60000                       # NEGELIR_SEC_BURST_WINDOW_MS
  sec_burst_dedup_window: 10000                    # NEGELIR_SEC_BURST_DEDUP_WINDOW
  # Denylist (Redis hash; sole writer = sec.rate.v1) — §7.3.
  sec_denylist_ttl_s: 3600                         # NEGELIR_SEC_DENYLIST_TTL_S
  sec_denylist_escalation_factor: 2.0              # NEGELIR_SEC_DENYLIST_ESCALATION_FACTOR
  sec_denylist_max_entries: 250000                 # NEGELIR_SEC_DENYLIST_MAX_ENTRIES
  # sec.alert.v1 envelope (§7.4) — generalized debounce.
  sec_alert_debounce_ttl_s: 60                     # NEGELIR_SEC_ALERT_DEBOUNCE_TTL_S
  sec_alert_critical_debounce_enabled: false       # NEGELIR_SEC_ALERT_CRITICAL_DEBOUNCE_ENABLED
  sec_alert_debouncer_max_buckets: 4096            # NEGELIR_SEC_ALERT_DEBOUNCER_MAX_BUCKETS
  # qa.request.v1 — NLP-side dedup window (§7.5 binding).
  qa_request_v1_dedup_window_s: 300                # NEGELIR_QA_REQUEST_V1_DEDUP_WINDOW_S

# ── Phase 8 — Self-maintenance plane (ops console + maint.event/ack) ────────
# §8.1 ops console baseline. CLI publishes maint.event.v1 and waits for
# maint.ack.v1 per expected consumer (kind→consumer-set map at
# ai/swarm/agents/maint/_ack_routing.py). Bus-down envelopes land in
# opsctl_spool_dir; replay via `make ops.spool-flush`. Empty
# audit/spool paths resolve to <data_dir>/maint/opsctl_*.
phase8:
  opsctl_ack_timeout_ms: 5000                      # NEGELIR_OPSCTL_ACK_TIMEOUT_MS
  opsctl_spool_max_entries: 1024                   # NEGELIR_OPSCTL_SPOOL_MAX_ENTRIES
  opsctl_critical_agents: "consensus.v1,sec.rate.v1,maint.backup.v1"  # NEGELIR_OPSCTL_CRITICAL_AGENTS
  opsctl_audit_path: ""                           # NEGELIR_OPSCTL_AUDIT_PATH
  opsctl_spool_dir: ""                            # NEGELIR_OPSCTL_SPOOL_DIR
  opsctl_lock_dir: ""                             # NEGELIR_OPSCTL_LOCK_DIR
  opsctl_lock_stale_factor: 2                      # NEGELIR_OPSCTL_LOCK_STALE_FACTOR
  maint_ack_payload_max_bytes: 4096                # NEGELIR_MAINT_ACK_PAYLOAD_MAX_BYTES
  maint_ack_reason_max_bytes: 512                  # NEGELIR_MAINT_ACK_REASON_MAX_BYTES
  maint_ack_details_max_bytes: 2048                # NEGELIR_MAINT_ACK_DETAILS_MAX_BYTES

# ── Storage paths ────────────────────────────────────────────────────────────
paths:
  data_dir: /data            # DATA_DIR
  model_dir: /data/models    # MODEL_DIR
  report_dir: /data/reports  # NEGELIR_REPORT_DIR

# ── Phase 3 — Training-pipeline pass/fail thresholds ───────────────────
training_thresholds:
  model_acc: 0.50            # NEGELIR_THRESHOLD_MODEL_ACC
  holdout_acc: 0.50          # NEGELIR_THRESHOLD_HOLDOUT_ACC
  quarantine_max: 0.10       # NEGELIR_THRESHOLD_QUARANTINE_MAX
  min_holdout_matches: 5     # NEGELIR_THRESHOLD_MIN_HOLDOUT_MATCHES
verification:
  window_weeks: 4            # NEGELIR_VERIFICATION_WINDOW_WEEKS

# ── Operational toggles ───────────────────────────────────────
operational:
  strict: false              # NEGELIR_STRICT  (1/true → fail validate() on unknown reserved-prefix env keys)

# ── LeagueConfig (per-league overrides; see ai/common/league_config.py) ──────
# Numbers below are the Turkish Süper Lig defaults. Each preset in
# `LEAGUE_REGISTRY` (en_premier_league, de_bundesliga, es_la_liga, …) overrides
# the subset of fields that differ for that league.
league:
  identity:
    league_id: tr_super_lig
    league_name: "Turkish Süper Lig"
    country: Turkey
    language: tr
  structure:
    teams_count: 19
    rounds_per_season: 38
    promotion_slots: 3
    relegation_slots: 4
  elo:
    initial: 1500.0
    k: 32.0
    home_advantage: 65.0
  goals:
    first_half_goal_pct: 0.47
    league_avg_goals: 2.65
  poisson:
    max_goals: 7
    ht_max_goals: 5
    home_goal_cap: 7
    away_goal_cap: 7
    draw_goal_cap: 5
    market_goal_cap: 6
    min_xg_floor: 0.3
  dixon_coles_rho: -0.13
  elo_xg_curve:
    divisor: 600.0
    factor_min: 0.7
    factor_range: 0.6
  venue_ratio:
    floor: 0.7
    ceiling: 1.4
  ensemble:
    xgb_weight: 0.35
  draw_thresholds:
    ha_gap: 0.15
    prob: 0.26
    bayesian: 0.20
  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.08
    min_child_weight: 3
    reg_alpha: 0.5
    reg_lambda: 1.5
    subsample: 0.8
    colsample_bytree: 0.8
    gamma: 0.1
  training:
    draw_sample_weight: 2.0
    val_split: 0.15
    train_pct: 0.75
    calibrate_probabilities: true
  demo:
    label: "Turkish Q&A Demo"
    sentiment_samples:
      - "Galatasaray son maçta muhteşem bir galibiyet aldı, takım morali çok yüksek"
      - "Fenerbahçe'de sakatlık krizi devam ediyor, taraftar moral bozuk"
      - "Beşiktaş istikrarlı oynuyor, savunma sağlam gidiyor"
