# `LEAGUE_REGISTRY` (en_premier_league, de_bundesliga, es_la_liga, …) overrides
# the subset of fields that differ for that league.
league:
  identity:
    league_id: tr_super_lig
    league_name: "Turkish Süper Lig"
    country: Turkey
    language: tr
  structure:
    teams_count: 19
    rounds_per_season: 38
    promotion_slots: 3
    relegation_slots: 4
  elo:
    initial: 1500.0
    k: 32.0
    home_advantage: 65.0
  goals:
    first_half_goal_pct: 0.47
    league_avg_goals: 2.65
  poisson:
    max_goals: 7
    ht_max_goals: 5
    home_goal_cap: 7
    away_goal_cap: 7
    draw_goal_cap: 5
    market_goal_cap: 6
    min_xg_floor: 0.3
  dixon_coles_rho: -0.13
  elo_xg_curve:
    divisor: 600.0
    factor_min: 0.7
    factor_range: 0.6
  venue_ratio:
    floor: 0.7
    ceiling: 1.4
  ensemble:
    xgb_weight: 0.35
  draw_thresholds:
    ha_gap: 0.15
    prob: 0.26
    bayesian: 0.20
  xgboost:
    n_estimators: 300
    max_depth: 4
