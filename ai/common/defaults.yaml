  opsctl_key_max_age_days: 365                     # NEGELIR_OPSCTL_KEY_MAX_AGE_DAYS
  opsctl_key_revocation_grace_days: 30             # NEGELIR_OPSCTL_KEY_REVOCATION_GRACE_DAYS
