  maint_backup_verify_pg_image: "postgres:16-alpine"  # NEGELIR_MAINT_BACKUP_VERIFY_PG_IMAGE
  maint_backup_pg_dump_nice_level: 10                 # NEGELIR_MAINT_BACKUP_PG_DUMP_NICE_LEVEL  (§8.14.9 UNIX nice; 0=disabled)
  maint_backup_pg_dump_ionice: true                   # NEGELIR_MAINT_BACKUP_PG_DUMP_IONICE  (§8.14.9 Linux ionice best-effort; ignored non-Linux)
  maint_backup_verify_mode: "full"                 # NEGELIR_MAINT_BACKUP_VERIFY_MODE  (full | toc_only)
  maint_backup_max_version_gap: 5                  # NEGELIR_MAINT_BACKUP_MAX_VERSION_GAP  (§8.13.4 restore version-invariant)
  maint_backup_verify_orphan_ttl_h: 6.0            # NEGELIR_MAINT_BACKUP_VERIFY_ORPHAN_TTL_H
  maint_backup_pvc_size_gb: 10                     # NEGELIR_MAINT_BACKUP_PVC_SIZE_GB  (K8s ephemeral PVC for restore-verify, Gi)
  maint_backup_pii_excluded_columns: "quarantine_samples.raw_bytes_b64"  # NEGELIR_MAINT_BACKUP_PII_EXCLUDED_COLUMNS
  maint_backup_pg_role: "negelir_backup"            # NEGELIR_MAINT_BACKUP_PG_ROLE  (fail_safe_wrong_pg_role / fail_safe_superuser gates)
  maint_backup_pg_secret_max_age_days: 120          # NEGELIR_MAINT_BACKUP_PG_SECRET_MAX_AGE_DAYS  (fail_safe_pg_secret_expired; alert@100d + 20d grace)
  maint_backup_cold_verify_cron: "0 5 * * 0"       # NEGELIR_MAINT_BACKUP_COLD_VERIFY_CRON  (Sun 05:00 UTC)
  maint_backup_age_binary_version: "1.2.0"           # NEGELIR_MAINT_BACKUP_AGE_BINARY_VERSION  (§8.14.3 supply-chain pin; fail_safe_age_version_mismatch)
  maint_backup_verify_key_rotate_per_dump: true     # NEGELIR_MAINT_BACKUP_VERIFY_KEY_ROTATE_PER_DUMP  (§8.9 two-class encryption)
  # ── §8.15.10 verify-concurrency + offsite credential hot-reload ─────────────────────
  maint_backup_verify_lock_timeout_s: 1800          # NEGELIR_MAINT_BACKUP_VERIFY_LOCK_TIMEOUT_S  (max seconds to wait for advisory lock)
  maint_backup_offsite_cred_reload_s: 60            # NEGELIR_MAINT_BACKUP_OFFSITE_CRED_RELOAD_S  (hot-reload interval for offsite credentials)
  maint_backup_offsite_credential_max_age_days: 90  # NEGELIR_MAINT_BACKUP_OFFSITE_CREDENTIAL_MAX_AGE_DAYS  (alert threshold)
  maint_backup_offsite_credential_grace_days: 30    # NEGELIR_MAINT_BACKUP_OFFSITE_CREDENTIAL_GRACE_DAYS  (grace on top of max_age)
  # Phase 8 §8.16.5 — multipart upload-id TTL + lifecycle assertion.
  maint_backup_offsite_state_max_age_h: 18          # NEGELIR_MAINT_BACKUP_OFFSITE_STATE_MAX_AGE_H  (skip probe if state file older than this)
  maint_backup_offsite_lifecycle_min_days: 2        # NEGELIR_MAINT_BACKUP_OFFSITE_LIFECYCLE_MIN_DAYS  (minimum acceptable AbortIncompleteMultipartUpload days)
  # ── §8.16.6 Object-Lock / WORM preflight probe ─────────────────────────────
  maint_backup_offsite_preflight_interval_h: 24     # NEGELIR_MAINT_BACKUP_OFFSITE_PREFLIGHT_INTERVAL_H  (recurring probe interval; 0=boot-only)
  maint_backup_offsite_object_lock_required: true   # NEGELIR_MAINT_BACKUP_OFFSITE_OBJECT_LOCK_REQUIRED  (mock sets false)
  fail_safe_offsite_object_lock_disabled: true      # NEGELIR_FAIL_SAFE_OFFSITE_OBJECT_LOCK_DISABLED
  fail_safe_offsite_retention_not_applied: true     # NEGELIR_FAIL_SAFE_OFFSITE_RETENTION_NOT_APPLIED
  fail_safe_offsite_lock_not_enforced: true         # NEGELIR_FAIL_SAFE_OFFSITE_LOCK_NOT_ENFORCED
  maint_backup_forensic_max_bytes: 262144           # NEGELIR_MAINT_BACKUP_FORENSIC_MAX_BYTES  (max sidecar bytes; 256 KiB)
  # ── ROADMAP §8.12 off-host replication ──────────────────────────────────────────────
  maint_backup_offsite_target: "none"             # NEGELIR_MAINT_BACKUP_OFFSITE_TARGET  (none|s3)
  maint_backup_offsite_endpoint: ""               # NEGELIR_MAINT_BACKUP_OFFSITE_ENDPOINT
  maint_backup_offsite_bucket: ""                 # NEGELIR_MAINT_BACKUP_OFFSITE_BUCKET
  maint_backup_offsite_multipart_threshold_mb: 64  # NEGELIR_MAINT_BACKUP_OFFSITE_MULTIPART_THRESHOLD_MB
  maint_backup_offsite_bw_kbps: 0                 # NEGELIR_MAINT_BACKUP_OFFSITE_BW_KBPS  (0=unlimited)
  maint_backup_offsite_upload_timeout_h: 6        # NEGELIR_MAINT_BACKUP_OFFSITE_UPLOAD_TIMEOUT_H
  maint_backup_offsite_object_lock_days: 0        # NEGELIR_MAINT_BACKUP_OFFSITE_OBJECT_LOCK_DAYS  (0=no WORM)
  maint_backup_offsite_age_alert_h: 48            # NEGELIR_MAINT_BACKUP_OFFSITE_AGE_ALERT_H  (0=watchdog disabled)
  maint_backup_offsite_retention_days: 7          # NEGELIR_MAINT_BACKUP_OFFSITE_RETENTION_DAYS
  maint_backup_offsite_access_key_id: ""          # NEGELIR_MAINT_BACKUP_OFFSITE_ACCESS_KEY_ID
  maint_backup_offsite_secret_access_key_secret_ref: ""  # NEGELIR_MAINT_BACKUP_OFFSITE_SECRET_ACCESS_KEY_SECRET_REF
  maint_backup_offsite_s3_region: "us-east-1"    # NEGELIR_MAINT_BACKUP_OFFSITE_S3_REGION
  maint_backup_offsite_rsync_host: ""             # NEGELIR_MAINT_BACKUP_OFFSITE_RSYNC_HOST
  maint_backup_offsite_rsync_dest_path: ""        # NEGELIR_MAINT_BACKUP_OFFSITE_RSYNC_DEST_PATH
  maint_backup_offsite_rsync_ssh_known_hosts: ""  # NEGELIR_MAINT_BACKUP_OFFSITE_RSYNC_SSH_KNOWN_HOSTS
  # ── §8.12 DR-drill cadence gauge ─────────────────────────────────────────
  maint_backup_dr_drill_csv: "data/backups/dr_drills.csv"  # NEGELIR_MAINT_BACKUP_DR_DRILL_CSV
  maint_backup_dr_drill_alert_days: 100           # NEGELIR_MAINT_BACKUP_DR_DRILL_ALERT_DAYS
  # ── §8.13.1 model-artifact backup discipline ──
  maint_backup_model_reproducibility_window_h: 24   # NEGELIR_MAINT_BACKUP_MODEL_REPRODUCIBILITY_WINDOW_H
  maint_backup_model_offsite_retention_days: 30     # NEGELIR_MAINT_BACKUP_MODEL_OFFSITE_RETENTION_DAYS
  maint_backup_model_lineage_missing_debounce_h: 24 # NEGELIR_MAINT_BACKUP_MODEL_LINEAGE_MISSING_DEBOUNCE_H

# ── Storage paths ────────────────────────────────────────────────────────────
paths:
  data_dir: /data            # DATA_DIR
  model_dir: /data/models    # MODEL_DIR
  report_dir: /data/reports  # NEGELIR_REPORT_DIR

# ── Phase 3 — Training-pipeline pass/fail thresholds ───────────────────
training_thresholds:
  model_acc: 0.50            # NEGELIR_THRESHOLD_MODEL_ACC
  holdout_acc: 0.50          # NEGELIR_THRESHOLD_HOLDOUT_ACC
  quarantine_max: 0.10       # NEGELIR_THRESHOLD_QUARANTINE_MAX
  min_holdout_matches: 5     # NEGELIR_THRESHOLD_MIN_HOLDOUT_MATCHES
verification:
  window_weeks: 4            # NEGELIR_VERIFICATION_WINDOW_WEEKS

# ── Operational toggles ───────────────────────────────────────
operational:
  strict: false              # NEGELIR_STRICT  (1/true → fail validate() on unknown reserved-prefix env keys)

# ── LeagueConfig (per-league overrides; see ai/common/league_config.py) ──────
