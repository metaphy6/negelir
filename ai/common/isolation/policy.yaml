# Phase 18.0 §18.1 — Isolation policy file
# Declares per-component import allow-lists, cross-component allowed dependencies,
# and forbidden import lists. AST-based checker matches imports against this policy.
# CODEOWNERS-protected; edits require triple approval per ledger #42.

schema_version: "18.0.1"
last_audited_at: "2026-06-15T00:00:00Z"

# Per-component import allow-lists
# Defines which external packages each component is allowed to import
components:
  datasource:
    # Datasource component (scrapers, extractors, enrichment)
    # Allowed external deps: stdlib, YAML parsing, data handling
    allowed_external_imports:
      - "yaml"
      - "requests"
      - "beautifulsoup4"
      - "lxml"
      - "aiohttp"
      - "asyncio"
      - "json"
      - "csv"
      - "regex"
    # Forbidden imports for datasource
    forbidden_imports:
      - "^fastapi$"
      - "^flask$"
      - "^swarm\\..*"
      - "^psycopg2?$"
      - "^asyncpg$"
      - "^redis$"
      - "^sqlalchemy$"

  swarm:
    # Swarm component (agents, predictors, coordination)
    # Allowed external deps: stdlib, numeric/ML for predictions
    allowed_external_imports:
      - "numpy"
      - "pandas"
      - "xgboost"
      - "sklearn"
      - "asyncio"
      - "json"
    # Forbidden imports for swarm — must NOT access databases directly
    forbidden_imports:
      - "^psycopg2?$"
      - "^asyncpg$"
      - "^sqlalchemy$"
      - "^fastapi$"
      - "^flask$"
      - "^requests$"
      - "^datasource\\..*"

  server:
    # Server component (Go REST API)
    # Allowed external deps declared in go.mod
    allowed_external_imports:
      - "github.com/gin-gonic/gin"
      - "github.com/lib/pq"
    # Forbidden imports for server
    forbidden_imports:
      - "^xgboost$"
      - "^torch$"
      - "^sklearn$"

  common:
    # Shared/contract layer (schemas, feeds, bus, config, observability)
    # Allowed to import from other common sub-packages
    allowed_external_imports:
      - "yaml"
      - "json"
      - "asyncio"
      - "dataclasses"
      - "typing"
    # Forbidden imports for common
    forbidden_imports:
      - "^fastapi$"
      - "^flask$"
      - "^psycopg2?$"
      - "^redis$"

# Cross-component allowed dependencies
# Defines which imports are allowed to cross component boundaries
cross_component_allowed:
  swarm:
    - "common.feeds.*"
    - "common.schemas.*"
    - "common.bus.*"
    - "common.observability.*"
  datasource:
    - "common.schemas.*"
    - "common.feeds.*"
    - "common.bus.*"
    - "common.config.*"
  server:
    - "common.api.*"
    - "common.schemas.*"
    - "common.observability.*"

# Public symbols that can be imported from each component
# If not listed here, cross-component imports fail even if component is allow-listed
public_symbols:
  common.feeds:
    - "FeedReader"
    - "FeedCursor"
    - "encode"
    - "idempotency_key"
  common.schemas:
    - "MatchRecord"
    - "TeamRecord"
    - "CompetitionRecord"
  common.bus:
    - "BusPublisher"
    - "BusSubscriber"
  common.observability:
    - "Logger"
    - "TelemetrySink"
  common.config:
    - "Config"
    - "get_config"
