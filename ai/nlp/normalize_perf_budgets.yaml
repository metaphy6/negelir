# Total budget aggregation (for CI reporting).
# Sum of all p99_ms values should not exceed this:
total_budget_p99_ms: 12.0

# Regression gate: tolerance on p99 before a failure is reported (10% = 1.1×).
# This carve-out accounts for cold-start, JIT, and first-run effects.
p99_regression_tolerance: 1.10

# Per-pass regression gate: p99 must not exceed `budget * tolerance`.
per_pass_p99_regression_tolerance: 1.20
