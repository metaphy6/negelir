  - name: "regional_dialect_normalize"
    p50_ms: 0.10
    p99_ms: 0.60
    gated: false
    description: "Regional/diaspora dialect normalization (§10.32.4)"

  - name: "apostrophe_proper_noun_repair"
    p50_ms: 0.08
    p99_ms: 0.40
    gated: true
    gate_flag: "nlp_harmony_tolerant_strip_enabled"
    description: "Turkish suffix-harmony repair for proper nouns (§10.32.5)"

  - name: "tokenize"
    p50_ms: 0.02
    p99_ms: 0.08
    gated: false
    description: "Whitespace + punctuation split"

  - name: "split_questions"
    p50_ms: 0.02
    p99_ms: 0.12
    gated: true
    gate_flag: "nlp_compound_query_enabled"
    description: "Turkish run-on/multi-question split (§10.24.5)"

  - name: "strip_combining_marks"
    p50_ms: 0.02
