  - name: "predictive_overshoot"
    p50_ms: 0.01
    p99_ms: 0.08
    gated: true
    gate_flag: "nlp_predictive_overshoot_enabled"
    description: "Predictive-text overshoot correction (§10.34.1)"

  - name: "inline_self_correction"
    p50_ms: 0.02
    p99_ms: 0.10
    gated: true
    gate_flag: "nlp_inline_self_correction_enabled"
    description: "Inline self-correction markers (§10.32.10)"

  - name: "compound_split"
    p50_ms: 0.05
