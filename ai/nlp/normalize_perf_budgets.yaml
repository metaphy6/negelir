# Phase 10 §10.34.2 — Normalize-chain per-pass performance budgets (binding).
#
# The normalize pipeline has grown to 11+ passes across §10.1, §10.21, §10.22,
# §10.28, §10.29, §10.30, §10.32, and §10.33. Without an explicit perf contract
# it quietly regresses with each addendum. This table pins per-pass p50/p99
# budgets (milliseconds) for the full input-to-tokens pipeline.
#
# Total budget: p99 ≤ 12ms (vs. §10.1 original 5ms; addenda required 7ms overhead).
#
# CODEOWNERS: nlp-curator + Go owner (Phase 7 sec-sanitize must obey same budgets
# on its parity passes; this spec is shared via ai/common/text/normalize_perf_budgets.json).
#
# Closed table binding:
#   * Entries cannot be reordered once pinned (matches normalize step order).
#   * Pass names must match ai/nlp/normalize.py step names (for CI tracking).
#   * Budgets are per-pass in isolation on the §10.18 golden corpus.
#   * CI regression gate: test_normalize_per_pass_budgets compares current vs
#     pinned and fails if any pass exceeds its p99 budget by > 10% (carve-out
#     for cold-start, JIT, first-run effects).
---
passes:
  - name: "length_cap"
    p50_ms: 0.01
    p99_ms: 0.05
    gated: false
    description: "Codepoint-length boundary check"

  - name: "html_entity_unescape"
    p50_ms: 0.02
    p99_ms: 0.08
    gated: true
    gate_flag: "nlp_html_unescape_enabled"
    description: "HTML entity decoding (e.g. &nbsp; → space)"

  - name: "canonical_normalize"
    p50_ms: 0.10
    p99_ms: 0.30
    gated: false
    description: "NFC + control-char/zero-width/RTL strip (parity with Phase 7)"

  - name: "compose_turkish_dotted_i"
    p50_ms: 0.03
    p99_ms: 0.10
    gated: false
    description: "Turkish dotted-i decomposition reassembly"

  - name: "paste_layout_normalize"
    p50_ms: 0.01
    p99_ms: 0.20
    gated: true
    gate_flag: "nlp_paste_layout_enabled"
    description: "PDF/paste layout char collapse (U+2028, U+2029, hard hyphens)"

  - name: "confusables_fold"
    p50_ms: 0.20
    p99_ms: 0.60
    gated: false
    description: "Unicode confusables fold (Cyrillic/Greek → ASCII-Turkish)"

  - name: "digit_letter_fold"
    p50_ms: 0.01
    p99_ms: 0.05
    gated: true
    gate_flag: "nlp_digit_letter_fold_enabled"
    description: "Digit-letter confusable (0/O, 1/l/I)"

  - name: "random_case_normalize"
    p50_ms: 0.02
    p99_ms: 0.10
    gated: true
    gate_flag: "nlp_random_case_enabled"
    description: "Random-case noise folding (intra-token case-flip detection)"

  - name: "lowercase_tr"
    p50_ms: 0.05
    p99_ms: 0.20
    gated: false
    description: "Turkish-aware lowercase (I→ı, İ→i, never str.lower())"

  - name: "obfuscated_slur_normalize"
    p50_ms: 0.10
    p99_ms: 0.40
    gated: false
    description: "Obfuscated slur defense (§10.30.10)"

  - name: "punct_normalize"
    p50_ms: 0.03
    p99_ms: 0.15
    gated: false
    description: "Punctuation normalization (curly quotes → straight, em-dash, etc.)"

  - name: "citation_tail_strip"
    p50_ms: 0.01
    p99_ms: 0.08
    gated: true
    gate_flag: "nlp_citation_tail_strip_enabled"
    description: "Strip copy-paste citation/URL tail"

  - name: "social_hygiene"
    p50_ms: 0.02
    p99_ms: 0.10
    gated: false
    description: "Social-token normalization (@mentions, #hashtags)"

  - name: "promote_suffixed_emoji"
    p50_ms: 0.01
    p99_ms: 0.08
    gated: true
    gate_flag: "nlp_suffixed_emoji_enabled"
    description: "Turkish-suffixed emoji → concept entity (⚽nın → maç)"

  - name: "emoji_hint_extract"
    p50_ms: 0.02
    p99_ms: 0.12
    gated: true
    gate_flag: "nlp_emoji_hint_enabled"
    description: "Emoji hint extraction before strip (🔴🟡 → team colors)"

  - name: "diacritic_restore"
    p50_ms: 0.15
    p99_ms: 0.80
    gated: true
    gate_flag: "nlp_diacritic_restore_enabled"
    description: "Diacritic restoration table-driven (§10.3)"

  - name: "strip_preamble"
    p50_ms: 0.01
    p99_ms: 0.08
    gated: true
    gate_flag: "nlp_preamble_strip_enabled"
    description: "Voice-to-text preamble stripping (e.g. 'Hey Siri')"

  - name: "ocr_confusion_repair"
    p50_ms: 0.01
    p99_ms: 0.80
    gated: true
    gate_flag: "nlp_ocr_repair_force"
