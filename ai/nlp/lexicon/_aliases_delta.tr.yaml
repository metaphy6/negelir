# Negelir -- NLP lexicon: Hand-curated alias delta
#
# Purpose:
#   This file contains ADDITIONAL aliases merged into generated lexicon files
#   by `make nlp.lexicon-build`. Allows operators to add regional slang,
#   newly coined nicknames, or cross-file clarifications WITHOUT editing the
#   auto-generated baseline files directly.
#
# Format:
#   file:         target lexicon filename (e.g. teams.tr.yaml)
#   kind:         the lexicon kind for the target file (team/player/league/competition/market)
#   canonical_id: target canonical_id in that file
#   source:       closed source identifier for the delta row
#   added_by_pr:  GitHub PR or operator reference that introduced the alias
#   added_at_utc: UTC timestamp when the alias was added
#   add_aliases:  list of additional alias strings to merge in
#   remove_aliases: (optional) list of alias strings to remove
#
# Rules enforced by `make nlp.lexicon-build`:
#   - Added aliases must pass §10.1 normalize round-trip
#   - No alias collision without entities_negative coverage
#   - `source` must be in the closed source set or match `fan_corpus_<n>`
#   - `added_by_pr` and `added_at_utc` are required metadata for auditability

