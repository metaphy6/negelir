# Phase 21 §21.30 Prometheus alert rules for enrichment planes

groups:
  - name: enrichment_alerts
    interval: 30s
    rules:
      - alert: EnrichmentPlaneScrapeErrorRate
        expr: rate(enrichment_scrape_total{status="error"}[10m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Enrichment plane high error rate"
          description: "Plane {{ $labels.plane }} has >20% scrape errors"
      
      - alert: EnrichmentPlaneStale
        expr: enrichment_plane_staleness_seconds > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Enrichment plane stale"
