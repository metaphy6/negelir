name: nlp-weekly-eval

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  weekly-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai/requirements.txt

      - name: Run weekly NLP evaluation
        run: make nlp.weekly-eval -- --prior-accuracy 0.96 --current-accuracy 0.94
