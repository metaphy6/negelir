name: nlp-cve-scan

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  nlp-cve-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==5.0.0

      - name: Run pip-audit
        run: |
          python -m pip_audit --format json --requirements ai/requirements.txt > cve_report.json
          cat cve_report.json

      - name: Publish scan summary
        run: |
          echo "CVE scan complete. See cve_report.json for details."
