# ─────────────────────────────────────────────────────────
#  Negelir — Full Development Stack
#  Usage: make up  (or docker compose up --build)
# ─────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-negelir}
      POSTGRES_USER: ${POSTGRES_USER:-negelir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negelir_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negelir}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Go Middleware Server ──────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-negelir}:${POSTGRES_PASSWORD:-negelir_dev_2026}@postgres:5432/${POSTGRES_DB:-negelir}?sslmode=disable
      REDIS_URL: redis:6379
      SERVER_PORT: 8080
      LOG_LEVEL: ${SERVER_LOG_LEVEL:-debug}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data

  # ── AI Engine ─────────────────────────────────────────
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-negelir}
      POSTGRES_USER: ${POSTGRES_USER:-negelir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negelir_dev_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_URL: http://server:8080
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-DEBUG}
      AI_DEVICE: ${AI_DEVICE:-auto}
      SCRAPE_RATE_LIMIT_SECONDS: ${SCRAPE_RATE_LIMIT_SECONDS:-5}
      SCRAPE_USER_AGENT: ${SCRAPE_USER_AGENT:-Negelir/0.1 (Football Analysis Research)}
      SCRAPE_RESPECT_ROBOTS_TXT: ${SCRAPE_RESPECT_ROBOTS_TXT:-true}
      SCRAPE_SOURCE_A: ${SCRAPE_SOURCE_A:-https://arsiv.mackolik.com}
      SCRAPE_SOURCE_B: ${SCRAPE_SOURCE_B:-https://www.mackolik.com}
      SCRAPE_SOURCE_C: ${SCRAPE_SOURCE_C:-https://www.tff.org}
      SCRAPE_SOURCE_D: ${SCRAPE_SOURCE_D:-https://www.mackolik.com}
      SCRAPE_SOURCE_EXTRA: ${SCRAPE_SOURCE_EXTRA:-}
      PYTHONUNBUFFERED: "1"
      SIMULATION_INTERVAL: ${SIMULATION_INTERVAL:-30}
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data

  # ── P2P Simulation ───────────────────────────────────
  p2p:
    build:
      context: ./p2p
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-negelir}
      POSTGRES_USER: ${POSTGRES_USER:-negelir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negelir_dev_2026}
      SERVER_URL: http://server:8080
      P2P_NODE_COUNT: ${P2P_NODE_COUNT:-5}
      P2P_BASE_PORT: ${P2P_BASE_PORT:-9000}
      P2P_SIMULATION_MATCHES: ${P2P_SIMULATION_MATCHES:-10}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-DEBUG}
      AI_DEVICE: ${AI_DEVICE:-auto}
      PYTHONUNBUFFERED: "1"
      SIMULATION_INTERVAL: ${SIMULATION_INTERVAL:-30}
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data

volumes:
  pg_data:
  redis_data:
