name: phase2-real-data-bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai/**"
      - "p2p/**"
      - "Makefile"
      - ".github/workflows/phase2-real-data-bootstrap.yml"

jobs:
  bootstrap-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai/requirements.txt

      - name: Bootstrap real data cache
        working-directory: ai
        env:
          NEGELIR_DEFAULT_LEAGUE_ID: super_lig
          DATA_DIR: ../data
        run: |
          mkdir -p ../data ../data/models
          for attempt in 1 2 3; do
            python -m scraper.real_data --league super_lig --output ../data/super_lig_real.json && break
            if [[ "$attempt" == "3" ]]; then
              echo "Real-data scrape failed after 3 attempts" >&2
              exit 1
            fi
            echo "Retrying scrape... (attempt $attempt failed)"
            sleep 5
          done
          python -m proofreader.validator --input ../data/super_lig_real.json --min-matches 100

      - name: Train model smoke test
        working-directory: ai
        env:
          NEGELIR_DEFAULT_LEAGUE_ID: super_lig
          DATA_DIR: ../data
          MODEL_DIR: ../data/models
        run: |
          python -m model.trainer
