# Phase 12 §12.13 — Nightly chaos & resilience lane
# Runs: chaos (Toxiproxy/Pumba), fuzz (Atheris/Go-fuzz), load, mutation scenarios
# Restrictions: self-hosted only, agent/** branches or scheduled cron (per ci-pipeline.instructions.md §4)
name: nightly-resilience

on:
  schedule:
    - cron: '0 22 * * *'   # nightly at 22:00 UTC
  push:
    branches:
      - 'agent/**'
    paths:
      - 'ai/**'
      - 'server/**'
      - 'xops/**'
      - '.github/workflows/nightly-resilience.yml'
  workflow_dispatch:        # manual trigger

jobs:
  chaos-resilience:
    runs-on: self-hosted
    timeout-minutes: 120
    # Safety guard: only on agent/** or scheduled, never on fork PRs
    if: |
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/heads/agent/') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap env
        run: make env

      - name: Run nightly lane (fuzz + load + chaos + mutation, ~90min)
        run: make ci.nightly
        env:
          NEGELIR_ENV: test
          NEGELIR_CHAOS_PROFILE: chaos

      - name: Collect & publish scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-scorecard-nightly
          path: data/chaos/ledger.jsonl
          retention-days: 30

      - name: Tear down chaos stack
        if: always()
        run: make chaos.down || true
